<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5G NR Case-Based Interview Quiz</title>
    <link rel="stylesheet" href="case-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="case-container">

    <header class="case-header">
        <h1>5G NR Case-Based Interview Simulator</h1>
        <p>Real 5G Troubleshooting &amp; Architecture Scenarios</p>
    </header>

    <!-- ── QUIZ SCREEN ── -->
    <section id="case-screen">

        <div class="case-info">
            <span id="case-number"></span>
            <span id="score-display"></span>
        </div>

        <!-- Score progress bar -->
        <div class="score-bar-container">
            <div id="score-bar"></div>
        </div>

        <div class="case-box">
            <h2 id="case-title"></h2>
            <p id="case-description"></p>
        </div>

        <div class="options-container">
            <button class="option-btn"></button>
            <button class="option-btn"></button>
            <button class="option-btn"></button>
            <button class="option-btn"></button>
        </div>

        <div class="action-buttons">
            <button id="next-btn">Next Scenario</button>
            <button id="explain-btn">Show Explanation</button>
        </div>

        <div id="explanation-box"></div>

    </section>

    <!-- ── RESULT SCREEN ── -->
    <section id="result-screen" style="display:none;">
        <div class="result-box">
            <h2>All Scenarios Completed! 🎯</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>

            <div class="result-buttons">
                <button id="restart-btn">
                    <i class="fas fa-redo"></i> Try Again
                </button>
                <a href="../index.html" class="QUIZ-btn">
                    <i class="fas fa-arrow-left"></i> Back to 5G Quiz
                </a>
                <a href="../../index.html" class="QUIZ-btn">
                    <i class="fas fa-arrow-left"></i> Back to About 5G page
                </a>
            </div>
        </div>
    </section>

</div>

<script src="case-quiz.js"></script>
</body>
</html>
